server {
    server_name scaffold.example.com;
    root /www/sites/scaffold/Console/public;
    index index.php;

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/scaffold.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/scaffold.example.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; allow all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ .*\.(woff|woff2|js|css|png|ico|jpg|jpeg|svg|webp|gif)$ {
        access_log off;
        expires 7d;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name scaffold.example.com;
    return 301 https://$host$request_uri;
}