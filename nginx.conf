server {
    server_name scaffold.hnher.com;
    root /www/sites/scaffold/Console/public;
    index index.php;

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/scaffold.hnher.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/scaffold.hnher.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /storage/ {
	    try_files $uri /index.php?$query_string;
	}
    location ~ .*\.(woff|js|css|png|ico|jpg)?$ {
	    access_log off;
    }
	location ~ \.php$ {
	    include fastcgi_params;
	    fastcgi_pass 127.0.0.1:9000;
	    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}
}
server {
    if ($host = scaffold.hnher.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen  80;
    server_name scaffold.hnher.com;
    return 404; # managed by Certbot
}